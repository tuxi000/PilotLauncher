# 自动构建 PilotLauncher（Windows x64）
#  - 推送到 main / 提交 PR / 手动运行：编译并上传构建产物（Actions 页面可下载，保留 14 天）
#  - 推送 v* 标签（例如 v0.1.0）：额外创建一个 Release 草稿，附上免安装 exe 和 NSIS 安装包
# CurseForge API Key 从仓库 Secrets 的 CURSEFORGE_API_KEY 读取，构建时内置进程序；
# 未配置时程序照常构建，只是 CurseForge 不可用（Modrinth 不受影响）。
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "标签 ${{ github.ref_name }} 与 src-tauri/tauri.conf.json 里的版本 $v 不一致，请先修改版本号"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        env:
          PILOT_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/pilot-launcher.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PilotLauncher-${{ github.ref_name }}-${{ github.run_number }}
          path: out/*
          retention-days: 14

      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: true
          generate_release_notes: true
